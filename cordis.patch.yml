# Replace DSH's native model-facing subagent tools while leaving the subagent
# registry, spawn/fork providers, continuation controls, jobs, and reporting
# services in place.
- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- insert:
    - id: task-model-routing
      name: dsh-task-models

    - id: enhanced-tool-subagent
      name: dsh-task-models/delegation
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: enhanced-tool-subagent-fork
      name: dsh-task-models/delegation
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: one-shot
